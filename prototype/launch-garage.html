<title>Launch Garage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a full-screen toy-city game. 3D view fills the screen; chunky toy-box HUD floats over it. One bright daytime look by choice. */
:root{
  --card-blue:#1440c4;
  --ink:#0b1a4d;
  --sun:#ffd21f;
  --flame:#ff7a1a;
  --white:#ffffff;
  --sky:#6fb0ff;
  --muted:#4a5a8c;
  --display:"Luckiest Guy","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);overscroll-behavior:none}
body{font-family:var(--body);font-weight:800;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;height:100%;width:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px}
.pill img{width:52px;height:40px;object-fit:cover;border-radius:10px;background:var(--white)}
.pill .t{display:flex;flex-direction:column;line-height:1.05}
.pill .t small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--flame);font-weight:900}
.pill .t b{font-family:var(--display);font-weight:400;font-size:clamp(17px,3.6vw,22px);color:var(--card-blue)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.coins{padding:6px 14px 4px 8px;font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.cn{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc21a 45%,#d48a00);border:2px solid var(--ink);vertical-align:-4px;margin-right:4px}
.best{font-size:12px;font-weight:900;color:var(--white);text-shadow:0 2px 0 var(--ink);letter-spacing:.04em}
.best b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.5px}

.dist{position:absolute;left:50%;top:max(70px,calc(env(safe-area-inset-top,0px) + 64px));transform:translateX(-50%);text-align:center;pointer-events:none}
.dist .n{font-family:var(--display);font-size:clamp(46px,11vw,76px);line-height:1;color:var(--sun);-webkit-text-stroke:3px var(--ink);text-shadow:0 5px 0 var(--ink);font-variant-numeric:tabular-nums}
.dist .n small{font-size:.45em}
.dist .rc{font-family:var(--display);font-size:22px;color:var(--white);-webkit-text-stroke:1.5px var(--ink);min-height:1em}

.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.btn{pointer-events:auto;font-family:var(--display);font-weight:400;letter-spacing:.5px;color:var(--ink);background:var(--sun);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);cursor:pointer;padding:12px 20px 8px;font-size:22px;transition:transform .08s;touch-action:none}
.btn:active,.btn.down{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 6px 0 var(--ink)}
.btn:focus-visible,.buy:focus-visible,.mini:focus-visible,.x:focus-visible{outline:4px solid var(--white);outline-offset:2px}
.btn.blue{background:var(--card-blue);color:var(--white)}
.btn.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{background:#fff27a;transform:translateY(-3px)}}
.aim{position:absolute;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom,0px) + 92px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(90%,360px)}
.aim p{margin:0;background:rgba(11,26,77,.78);color:var(--white);border-radius:14px;padding:8px 14px;font-size:15px;text-align:center;line-height:1.3}
.aim .arrow{font-family:var(--display);font-size:34px;color:var(--white);-webkit-text-stroke:2px var(--ink);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(10px)}}
.power{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:18px;height:min(40%,240px);border:3px solid var(--ink);border-radius:12px;background:rgba(255,255,255,.7);overflow:hidden;pointer-events:none}
.power::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*100%);background:linear-gradient(0deg,var(--sun),var(--flame) 70%,#e8231c)}

.flight{display:flex;gap:12px;align-items:flex-end;margin-left:auto}
.boost{position:relative;overflow:hidden;background:#e8231c;color:var(--white);min-width:110px}
.boost::before{content:"";position:absolute;left:0;bottom:0;height:6px;width:calc(var(--f,1)*100%);background:var(--sun)}
.special{background:var(--sun);min-width:150px;display:flex;flex-direction:column;align-items:center;line-height:1}
.special small{font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}

.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,26,77,.35);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--white);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:18px 22px 20px;width:min(100%,360px);text-align:center;display:flex;flex-direction:column;gap:6px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7)}}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--flame);-webkit-text-stroke:2px var(--ink)}
.card .d{font-family:var(--display);font-size:56px;line-height:1;color:var(--card-blue);font-variant-numeric:tabular-nums}
.card .nb{display:inline-block;align-self:center;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:900}
.card .earn{font-family:var(--display);font-size:28px;color:var(--ink)}
.card .brk{font-size:13px;color:var(--muted)}
.card .acts{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}

.garage{position:absolute;inset:0;background:rgba(11,26,77,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{pointer-events:auto;background:#eef4ff;border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;width:min(100%,640px);max-height:88%;overflow-y:auto;padding-top:16px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40%)}}
.gh{display:flex;align-items:center;gap:12px}
.gh img{width:96px;height:76px;object-fit:cover;border-radius:14px;border:3px solid var(--card-blue);background:var(--white);flex:none}
.gh .gt{flex:1;min-width:0}
.gh h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1;color:var(--card-blue)}
.gh p{margin:4px 0 0;font-size:13px;color:var(--ink);font-weight:700;line-height:1.35}
.gh p b{color:var(--flame);font-weight:900}
.x{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;background:var(--white);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:22px;flex:none}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wallet .coins{box-shadow:0 3px 0 var(--ink)}
.prog{flex:1;min-width:180px}
.prog .bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.prog .bar i{display:block;height:100%;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--sun),var(--flame));transition:width .3s}
.prog small{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:800}
.upg{display:flex;align-items:center;gap:12px;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:10px 12px}
.upg svg{width:40px;height:40px;flex:none;fill:var(--card-blue);stroke:var(--ink);stroke-width:1}
.upg-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.upg-txt b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);line-height:1}
.upg-txt span{font-size:13px;color:var(--muted);font-weight:700;line-height:1.3}
.pips{display:flex;gap:5px;margin-top:3px}
.pips i{width:24px;height:10px;border-radius:5px;border:2px solid var(--ink);background:var(--white)}
.pips i.on{background:var(--flame)}
.buy{font-family:var(--display);font-size:18px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 12px 5px;cursor:pointer;min-width:92px;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy .cn{width:16px;height:16px;vertical-align:-2px}
.buy:disabled{background:#dfe5f2;color:var(--muted);cursor:default;box-shadow:0 4px 0 var(--muted);border-color:var(--muted)}
.unlock{align-self:stretch;font-size:24px}
h4{margin:2px 0 -4px;font-family:var(--display);font-weight:400;font-size:20px;color:var(--card-blue)}
.cars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:520px){.cars{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mini{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--white);border:3px solid var(--card-blue);border-radius:14px;padding:4px;display:flex;flex-direction:column;gap:2px;align-items:center}
.mini img{width:100%;aspect-ratio:360/286;object-fit:cover;border-radius:9px}
.mini span{font-size:11px;font-weight:900;text-align:center;line-height:1.1;color:var(--ink)}
.mini[aria-pressed="true"]{background:var(--sun);border-color:var(--ink)}
.mini:disabled{cursor:default;border-color:#b9c3dc}
.mini:disabled img{filter:grayscale(1) brightness(.35)}
.mini em{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--display);font-size:30px;color:var(--white)}
.tools{display:flex;gap:8px;flex-wrap:wrap;border-top:2px dashed #b9c3dc;padding-top:10px}
.tools span{font-size:12px;color:var(--muted);width:100%}
.tools button{font:800 13px var(--body);background:var(--white);color:var(--ink);border:2px solid var(--muted);border-radius:10px;padding:6px 10px;cursor:pointer}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--white);-webkit-text-stroke:1.5px var(--ink);pointer-events:none}
@media (prefers-reduced-motion:reduce){.btn,.card,.sheet,.aim .arrow,.btn.glow{animation:none;transition:none}}
</style>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Launch game: the car sits in a catapult at the start of a toy city street"></canvas>
  <div class="loading" id="loading">Building the city…</div>
  <div class="hud">
    <div class="row">
      <div class="pill"><img id="carImg" alt=""><div class="t"><small id="carTier">Car 1 of 6</small><b id="carName">Banana Buggy</b></div></div>
      <div class="right">
        <div class="pill coins"><span class="cn" aria-hidden="true"></span><span id="coins">0</span></div>
        <div class="best">BEST <b id="best">—</b></div>
      </div>
    </div>
    <div class="bottom">
      <button class="btn blue" id="garageBtn">Garage</button>
      <div class="flight" id="flight" hidden>
        <button class="btn boost" id="boostBtn">BOOST</button>
        <button class="btn special" id="specialBtn"><small>Action</small><span id="specialName">Swerve</span></button>
      </div>
    </div>
  </div>
  <div class="dist" id="dist" hidden><div class="n"><span id="distNum">0</span><small> m</small></div><div class="rc" id="runCoins"></div></div>
  <div class="aim" id="aimhint"><p>Drag down to pull back. Drag left or right to aim. Let go to launch!</p><div class="arrow" aria-hidden="true">▼</div></div>
  <div class="power" id="power" aria-hidden="true"></div>

  <div class="result" id="result" hidden>
    <div class="card" role="dialog" aria-labelledby="resTitle">
      <h2 id="resTitle">CRASH!</h2>
      <div class="d" id="resDist">0 m</div>
      <span class="nb" id="resBest" hidden>New best!</span>
      <div class="earn"><span class="cn" aria-hidden="true"></span><span id="resCoins">+0</span></div>
      <div class="brk" id="resBreak"></div>
      <div class="acts"><button class="btn" id="againBtn">Launch again</button><button class="btn blue" id="resGarage">Garage</button></div>
    </div>
  </div>

  <div class="garage" id="garage" hidden>
    <div class="sheet" role="dialog" aria-labelledby="gName">
      <div class="gh">
        <img id="gImg" alt="">
        <div class="gt"><h3 id="gName">Banana Buggy</h3><p><b id="gSpecial">Swerve</b>: <span id="gSpecialText"></span></p></div>
        <button class="x" id="closeGarage" aria-label="Close garage">✕</button>
      </div>
      <div class="wallet">
        <div class="pill coins"><span class="cn" aria-hidden="true"></span><span id="gCoins">0</span></div>
        <div class="prog"><div class="bar"><i id="gProg"></i></div><small id="gProgTxt"></small></div>
      </div>
      <div id="upgList" style="display:flex;flex-direction:column;gap:10px"></div>
      <button class="btn unlock" id="unlockBtn" hidden>Unlock!</button>
      <h4>Your cars</h4>
      <div class="cars" id="carList"></div>
      <div class="tools"><span>Testing tools for the mock-up</span><button id="testCoins">+1,000 coins</button><button id="testMax">Max this car</button><button id="testReset">Start over</button></div>
    </div>
  </div>
</div>

  amber: ()=>std(0xffa31a,{emissive:0xff8a00, emissiveIntensity:1.8}),
  gold: ()=>paint(0xffc21a,{metalness:.9, roughness:.22}),
  white: ()=>paint(0xf6f8fb),
  eyeBlack: ()=>paint(0x111216),
};
function shapeFrom(cmds){
  const s = new THREE.Shape();
  for(const c of cmds){
    if(c[0]==='m') s.moveTo(c[1],c[2]);
    else if(c[0]==='l') s.lineTo(c[1],c[2]);
    else if(c[0]==='q') s.quadraticCurveTo(c[1],c[2],c[3],c[4]);
    else if(c[0]==='b') s.bezierCurveTo(c[1],c[2],c[3],c[4],c[5],c[6]);
  }
  return s;
}
/* re-aim a slab's inner mesh: where shape x, shape y and extrude-z should point */
function orient(p, xa, ya, za){ p.children[0].quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xa,ya,za)); return p; }
function finish(m){ m.castShadow = true; m.receiveShadow = true; return m; }
/* side profile (shape x -> car z, shape y -> up), extruded across width (car x) */
function slab(g, cmds, width, bevel, mat, x=0,y=0,z=0, rx=0, ry=0, rz=0){
  const depth = Math.max(.002, width - 2*bevel);
  const geo = new THREE.ExtrudeGeometry(shapeFrom(cmds), {depth, bevelEnabled: bevel>0, bevelThickness: bevel, bevelSize: bevel*.92, bevelSegments: bevel>0?6:0, curveSegments: 22});
  geo.translate(0,0,-depth/2);
  const inner = finish(new THREE.Mesh(geo, mat)); inner.rotation.y = -Math.PI/2;
  const p = new THREE.Group(); p.add(inner); p.position.set(x,y,z); p.rotation.set(rx,ry,rz);
  g.add(p); return p;
}
function rbox(g, w,h,d, r, mat, x=0,y=0,z=0, rx=0,ry=0,rz=0){
  r = Math.min(r, w/2-.001, h/2-.001, d/2-.001);
  const a = Math.max(.001, d/2 - r), b = Math.max(.001, h/2 - r);
  return slab(g, [['m',-a,-b],['l',a,-b],['l',a,b],['l',-a,b],['l',-a,-b]], w, r, mat, x,y,z, rx,ry,rz);
}
function mesh(g, geo, mat, x=0,y=0,z=0, rx=0,ry=0,rz=0){
  const m = finish(new THREE.Mesh(geo, mat)); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); g.add(m); return m;
}
function tube(g, pts, r, mat, closed=false){
  return mesh(g, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>V3(...p)), closed), 40, r, 12, closed), mat);
}
function lathe(g, pts, mat, segs=40){
  return new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>V2(p[0],p[1])), segs), mat);
}
function cyl(g, rt, rb, h, mat, x,y,z, rx=0,ry=0,rz=0, segs=28){
  return mesh(g, new THREE.CylinderGeometry(rt, rb, h, segs), mat, x,y,z, rx,ry,rz);
}
function sphere(g, r, mat, x,y,z, sx=1,sy=1,sz=1){
  const m = mesh(g, new THREE.SphereGeometry(r, 28, 18), mat, x,y,z); m.scale.set(sx,sy,sz); return m;
}
/* a lamp: glowing disc facing backwards */
function lamp(g, r, mat, x,y,z){ return cyl(g, r, r, .06, mat, x,y,z, Math.PI/2,0,0, 24); }
function plate(g, text, x,y,z, w=.62){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 96;
  const c = cv.getContext('2d');
  c.fillStyle = '#ffd21f'; c.beginPath(); c.roundRect ? c.roundRect(4,4,248,88,14) : c.rect(4,4,248,88); c.fill();
  c.strokeStyle = '#0b1a4d'; c.lineWidth = 6; c.stroke();
  c.fillStyle = '#0b1a4d'; c.font = '900 52px Nunito, Arial, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 128, 52);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w*96/256), new THREE.MeshStandardMaterial({map:t, roughness:.5}));
  m.position.set(x,y,z); g.add(m); return m;
}
/* rounded tyre + spoked rim. Axis along x. Returns {group, spin, rims} */
function makeWheel(r, w, rimColor, opts={}){
  const outer = new THREE.Group(), spin = new THREE.Group(); outer.add(spin);
  const ri = r*(opts.rimRatio||.6), e = Math.min(r*.28, w*.32);
  const pts = [[ri*.98, -w/2+.01]];
  for(let i=0;i<=8;i++){ const a=i/8*Math.PI/2; pts.push([r-e + Math.sin(a)*e, -w/2 + e - Math.cos(a)*e]); }
  for(let i=0;i<=8;i++){ const a=i/8*Math.PI/2; pts.push([r-e + Math.cos(a)*e, w/2 - e + Math.sin(a)*e]); }
  pts.push([ri*.98, w/2-.01]);
  const tyre = finish(lathe(spin, pts, MAT.rubber(), 48)); tyre.rotation.z = Math.PI/2; spin.add(tyre);
  if(opts.tread){
    const n = opts.tread, lug = new THREE.BoxGeometry(w*.8, r*.07, r*.14);
    for(let i=0;i<n;i++){
      const a = i/n*Math.PI*2, k = finish(new THREE.Mesh(lug, MAT.rubber()));
      k.position.set((i%2? .06:-.06)*w, Math.cos(a)*(r-.005), Math.sin(a)*(r-.005)); k.rotation.x = -a; spin.add(k);
    }
  }
  const rimMat = paint(rimColor, {metalness:.55, roughness:.25});
  const rims = [];
  [-1,1].forEach(s=>{
    const dish = finish(new THREE.Mesh(new THREE.CylinderGeometry(ri*.98, ri*.98, .04, 36), MAT.dark()));
    dish.rotation.z = Math.PI/2; dish.position.x = s*(w/2-.08); spin.add(dish);
    const lip = finish(new THREE.Mesh(new THREE.TorusGeometry(ri*.93, ri*.07, 10, 40), rimMat));
    lip.rotation.y = Math.PI/2; lip.position.x = s*(w/2-.04); spin.add(lip); rims.push(lip);
    const spokes = opts.spokes || 5;
    for(let i=0;i<spokes;i++){
      const a = i/spokes*Math.PI*2;
      const sp = finish(new THREE.Mesh(new THREE.BoxGeometry(.05, ri*.82, ri*.2), rimMat));
      sp.position.set(s*(w/2-.05), Math.cos(a)*ri*.45, Math.sin(a)*ri*.45); sp.rotation.x = -a; spin.add(sp); rims.push(sp);
    }
    const cap = finish(new THREE.Mesh(new THREE.CylinderGeometry(ri*.22, ri*.26, .08, 24), MAT.chrome()));
    cap.rotation.z = Math.PI/2; cap.position.x = s*(w/2-.02); spin.add(cap);
  });
  return {group: outer, spin, rims, r};
}
function addWheel(car, x,y,z, r,w, rim, opts){
  const wh = makeWheel(r,w,rim,opts); wh.group.position.set(x,y,z); car.add(wh.group);
  car.userData.wheels.push(wh); return wh;
}
function newCar(){
  const g = new THREE.Group();
  g.userData = {wheels:[], flames:[], spinners:[]};
  return g;
}
/* engine glow flame (for boost + rocket) pointing +z */
function flameCone(g, r, len, x,y,z){
  const grp = new THREE.Group(); grp.position.set(x,y,z);
  const outer = new THREE.Mesh(new THREE.ConeGeometry(r, len, 20, 1, true), new THREE.MeshBasicMaterial({color:0xff7a1a, transparent:true, opacity:.75, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  outer.rotation.x = Math.PI/2; outer.position.z = len/2; grp.add(outer);
  const inner = new THREE.Mesh(new THREE.ConeGeometry(r*.55, len*.62, 16, 1, true), new THREE.MeshBasicMaterial({color:0xfff2a0, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  inner.rotation.x = Math.PI/2; inner.position.z = len*.31; grp.add(inner);
  g.add(grp); return grp;
}

/* ================= PHYSICS (no THREE, so it can be tested on its own) ================= */
const G = 24, THETA = 35*Math.PI/180;
const BASE_SPEED = [22, 30, 38, 47, 56, 66];
const MAX_LV = 3;
const SPECIALS = [
  {name:'Swerve',          text:'Tap in the air to curve round the next building.'},
  {name:'Flame Boost',     text:'Tap in the air for a short blast of flames.'},
  {name:'Chomp',           text:'Bites straight through one building, then carries on.'},
  {name:'Stomp',           text:'Stomps straight through one building, then carries on.'},
  {name:'Rocket Boost',    text:'Tap in the air for a two-second rocket blast.'},
  {name:'Lightning Strike',text:'Zaps the next building out of the way.'},
];
function launchSpeed(idx, lv, power){ return (BASE_SPEED[idx] + 6*lv.engine) * (.32 + .68*power); }
function makeShot(idx, lv, power, heading){
  const sp = launchSpeed(idx, lv, power);
  const h = sp*Math.cos(THETA);
  return {idx, lv, x:0, y:0, z:0, vx:-Math.sin(heading)*h, vy:sp*Math.sin(THETA), vz:-Math.cos(heading)*h,
    heading, mode:'air', fuel:.32*lv.boost, burn:0, smash:false, swerve:null, special:false, boosting:false, t:0, events:[]};
}
function nextBuilding(d){ return COURSE.find(o=>(o.kind==='bld' || o.kind==='bus') && o.z > d + 2); }
function useSpecial(s){
  if(s.special || s.mode==='stop' || s.mode==='crash') return false;
  s.special = true;
  const k = s.idx, d = -s.z;
  if(k===0){ const o = nextBuilding(d); s.swerve = o ? {o, x: o.gap==null ? 0 : o.gap} : null; s.events.push('swerve'); }
  if(k===1){ s.burn = 1.3; if(s.mode==='roll') s.mode='air'; s.events.push('burn'); }
  if(k===2 || k===3){ s.smash = true; s.events.push('armed'); }
  if(k===4){ s.burn = 2.0; if(s.mode==='roll') s.mode='air'; s.events.push('burn'); }
  if(k===5){ s.events.push('zap'); }
  return true;
}
/* one fixed step. inp = {boost:bool, steer:-1..1} */
function stepShot(s, dt, inp){
  s.t += dt; s.boosting = false;
  if(s.mode==='stop') return;
  const lv = s.lv;
  // banana swerve: curve towards the gap in the next building, then straighten up
  if(s.swerve && s.mode!=='crash'){
    const o = s.swerve.o, d = -s.z, past = d > o.z + o.d + 2;
    const want = past ? 0 : Math.atan2(-(s.swerve.x - s.x), Math.max(4, o.z - d));
    let diff = want - s.heading; const step = 1.6*dt; diff = Math.max(-step, Math.min(step, diff));
    if(Math.abs(diff) > 1e-5){ const c=Math.cos(diff), n=Math.sin(diff); const vx = s.vx*c + s.vz*n, vz = -s.vx*n + s.vz*c; s.vx=vx; s.vz=vz; s.heading += diff; }
    if(past && Math.abs(s.heading) < .01) s.swerve = null;
  }
  const fx=-Math.sin(s.heading), fz=-Math.cos(s.heading);
  if(s.mode==='air' || s.mode==='crash'){
    let g = G;
    if(s.mode==='air'){
      if(inp && inp.boost && s.fuel>0){ s.fuel -= dt; s.vx += fx*14*dt; s.vz += fz*14*dt; s.vy += 7*dt; s.boosting = true; }
      if(s.burn>0){ s.burn -= dt; s.vx += fx*16*dt; s.vz += fz*16*dt; s.vy += 8*dt; s.boosting = true; }
      if(s.vy < 0 && lv.wings>0) g *= (1 - .16*lv.wings);
    }
    s.vy -= g*dt;
    s.x += s.vx*dt; s.y += s.vy*dt; s.z += s.vz*dt;
    if(s.y <= 0){
      s.y = 0;
      if(s.mode==='crash'){ s.vx=s.vz=s.vy=0; s.mode='stop'; return; }
      if(s.vy < -5){
        s.events.push('bounce');
        s.vy = -s.vy*(.2 + .06*lv.wheels);
        const k = .68 + .05*lv.wheels; s.vx*=k; s.vz*=k;
      } else { s.vy = 0; s.mode = 'roll'; s.events.push('land'); }
    }
  } else if(s.mode==='roll'){
    let sp = Math.hypot(s.vx, s.vz);
    if(s.burn>0){ s.burn -= dt; sp += 20*dt; s.boosting = true; }
    sp -= (14 - 2.2*lv.wheels)*dt;
    if(sp <= .25){ s.vx=s.vz=0; s.mode='stop'; s.events.push('stop'); return; }
    const a = Math.atan2(s.vx, s.vz); s.vx = Math.sin(a)*sp; s.vz = Math.cos(a)*sp;
    s.x += s.vx*dt; s.z += s.vz*dt;
  }
}
function upgradeCost(idx, lvl){ return Math.round(30*(lvl+1)*(1 + idx*.75)/5)*5; }

const BLD_COLORS = [0xff8a65,0xffc94d,0x7fc8f8,0x9ad66b,0xc89bf0,0xff9fc4,0x5fd3c3,0xf2f2ee,0x8fa8ff,0xffb36b];
const bldMats = BLD_COLORS.map(c=>new THREE.MeshStandardMaterial({color:c, map:winTex, roughness:.75, metalness:.02}));
const roofMat = new THREE.MeshStandardMaterial({color:0x8b8f98, roughness:.9});
function winBox(w,h,d, mat){
  const g = new THREE.BoxGeometry(w,h,d), uv = g.attributes.uv;
  const faceDims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++) for(let i=0;i<4;i++){
    const k = f*4+i;
    if(f===2||f===3){ uv.setXY(k, .02, .95); continue; }
    uv.setXY(k, uv.getX(k)*Math.max(1,Math.round(faceDims[f][0]/3.6)), uv.getY(k)*Math.max(1,Math.round(faceDims[f][1]/3.2)));
  }
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true; return m;
}
function building(x, z, w, h, d, ci, group=city){
  const b = winBox(w,h,d, bldMats[ci%bldMats.length]); b.position.set(x, h/2, z); group.add(b);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(w+.4,.5,d+.4), roofMat); cap.position.set(x, h+.25, z); group.add(cap);
  return b;
}

const obstacles = [];  // {o, box:Box3, group, broken}
function coneRow(o){
  const g = new THREE.Group();
  const coneGeo = new THREE.LatheGeometry([[0,.9],[.08,.88],[.3,.06],[.42,.06],[.42,0],[0,0]].map(p=>V2(p[0],p[1])), 24);
  const cm = paint(0xff6a13), wm = paint(0xffffff);

    const r = new THREE.Mesh(new THREE.CylinderGeometry(.2,.25,.16,24,1,true), wm); r.position.set(x,.5,0); g.add(r);

}
function toyCar(color){
  const g = new THREE.Group(), p = paint(color);
  slab(g, [['m',-1.7,.35],['q',-1.85,.7,-1.4,.75],['l',-.7,.8],['q',-.3,1.35,.35,1.35],['q',1.1,1.35,1.3,.8],['l',1.62,.75],['q',1.8,.6,1.7,.35],['l',-1.7,.35]], 1.7, .2, p);
  slab(g, [['m',-.55,.82],['q',-.25,1.25,.3,1.25],['q',.95,1.25,1.15,.82],['l',-.55,.82]], 1.74, .03, MAT.glass());
  [-1,1].forEach(s=>[-1.05,1.05].forEach(z=>{ const w = makeWheel(.36,.28,0xdfe3ea); w.group.position.set(s*.8,.36,z); g.add(w.group); }));
  g.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  return g;
}
function carRow(){
  const g = new THREE.Group(), cols = [0x2bb3ff,0xff4fa0,0x7bd34a,0xffd21f,0xa36bff];
  let i=0; for(let x=-ROAD_HALF+2.2; x<ROAD_HALF; x+=4.3){ const c = toyCar(cols[i++%cols.length]); c.rotation.y = Math.PI/2 + (rnd()-.5)*.2; c.position.x = x; g.add(c); }
  return g;
}
function bus(gap){
  const g = new THREE.Group(), Y = paint(0xffc21a);
  [gap-1.5-4.4, gap+1.5+4.4].forEach(x=>{
    const b = new THREE.Group(); b.position.x = x; b.rotation.y = Math.PI/2; g.add(b);
    rbox(b, 2.4,2.8,8.6,.45, Y, 0,1.75,0);
    rbox(b, 2.46,.9,7.8,.2, MAT.glass(), 0,2.35,0);
    rbox(b, 2.5,.18,8.62,.08, paint(0x1d1f24), 0,1.35,0);
    [-1,1].forEach(s=>[-2.8,2.6].forEach(z=>{ const w = makeWheel(.5,.36,0xdfe3ea); w.group.position.set(s*1.15,.5,z); b.add(w.group); }));
    b.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  });
  return g;
}
const SIGN_COLS = [['#e8231c','#ffd21f'],['#1440c4','#ffffff'],['#ff7a1a','#ffffff'],['#7b3fd1','#ffd21f'],['#0f9d58','#ffffff']];
COURSE.forEach((o,i)=>{
  const z0 = -o.z, zc = -(o.z + o.d/2);
  let group, parts = [];
  if(o.kind==='cones'){ group = coneRow(o); group.position.z = zc; parts.push({x0:-ROAD_HALF,x1:ROAD_HALF}); }
  else if(o.kind==='cars'){ group = carRow(); group.position.z = zc; parts.push({x0:-ROAD_HALF,x1:ROAD_HALF}); }
  else if(o.kind==='bus'){ group = bus(o.gap); group.position.z = zc; parts.push({x0:-ROAD_HALF-3, x1:o.gap-1.5}); parts.push({x0:o.gap+1.5, x1:ROAD_HALF+3}); }
  else {
    group = new THREE.Group(); group.position.z = zc;
    const span = (ROAD_HALF+WALK+.4), gw = 3.8, ci = i;
    if(o.gap==null){ parts.push({x0:-span,x1:span}); }
    else { parts.push({x0:-span, x1:o.gap-gw/2}); parts.push({x0:o.gap+gw/2, x1:span}); }
    parts.forEach((p,j)=>{ const w = p.x1-p.x0; building((p.x0+p.x1)/2, 0, w, o.h, o.d, ci*3+j, group); });
    const [bg,fg] = SIGN_COLS[i%SIGN_COLS.length];
    const sg = new THREE.Mesh(new THREE.BoxGeometry(Math.min(12, o.h*1.1+4), Math.min(3, 1.4+o.h*.06), .3), new THREE.MeshStandardMaterial({map:signTex(o.sign,bg,fg), roughness:.5, emissive:0x222222}));
    sg.position.set(o.gap==null ? 0 : (o.gap<0 ? 3.5 : -3.5), o.h + 1.6 + o.h*.03, o.d/2 - .3); group.add(sg);
    // posts holding the sign
    [-1,1].forEach(s=>{ const pp = new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,1.4,8), MAT.chrome()); pp.position.set(sg.position.x + s*sg.geometry.parameters.width*.35, o.h+.7, o.d/2-.3); group.add(pp); });
    if(o.gap!=null){ // a little arch over the alley so kids can see it's a way through
      const arch = new THREE.Mesh(new THREE.TorusGeometry(gw/2, .18, 10, 24, Math.PI), paint(0xffd21f)); arch.position.set(o.gap, 3.4, o.d/2+.05); group.add(arch);
    }
  }
  city.add(group);
  parts.forEach(p=>obstacles.push({x0:p.x0, x1:p.x1, z0:o.z, z1:o.z+o.d, h:o.h, group, o, broken:false}));
});

function stretch(m, a, b){
  const d = new THREE.Vector3().subVectors(b,a), L = d.length();
  m.position.copy(a).addScaledVector(d,.5); m.scale.set(1,L,1);
  m.quaternion.setFromUnitVectors(V3(0,1,0), d.normalize());
}

/* ---------- player car ---------- */
let car = null, carRear = 2.2, carIdx = save.car;
function loadCar(i){
  if(car) scene.remove(car);
  carIdx = i; car = CAR_BUILDERS[i](); scene.add(car);
  car.traverse(o=>{ if(o.isMesh){ o.castShadow = true; } });
  fitUpgrades(car, save.lv[i], CARS[i].accent); linearize(car);
  car.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(car); carRear = box.max.z;
  car.userData.flames.forEach(f=>f.visible = (i===4));
  resetShot();
  refreshHUD();
}

/* ---------- particles ---------- */
const parts = [];
const puffGeo = new THREE.SphereGeometry(1, 12, 8), starGeo = new THREE.OctahedronGeometry(.25);
function spawn(kind, pos, n){
  for(let i=0;i<n;i++){
    const mat = kind==='dust' ? new THREE.MeshLambertMaterial({color:0xe8e2d4, transparent:true, opacity:.8, depthWrite:false})
             : kind==='star' ? new THREE.MeshBasicMaterial({color:[0xffd21f,0xffffff,0xff7a1a][i%3], transparent:true})
             : kind==='spark' ? new THREE.MeshBasicMaterial({color:0x9fd8ff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false})
             : new THREE.MeshStandardMaterial({color:[0xff8a65,0xffc94d,0x7fc8f8][i%3], roughness:.7, transparent:true});
    const m = new THREE.Mesh(kind==='dust'?puffGeo:starGeo, mat); m.position.copy(pos);
    const a = Math.random()*Math.PI*2, up = kind==='dust' ? .5+Math.random() : 3+Math.random()*5;
    const sp = kind==='dust' ? 2+Math.random()*2 : 4+Math.random()*6;
    m.userData = {v:V3(Math.cos(a)*sp, up, Math.sin(a)*sp), life:0, max: kind==='dust'?1.0:1.2, kind};
    if(kind==='dust') m.scale.setScalar(.4+Math.random()*.4);
    linearize(m); scene.add(m); parts.push(m);
  }
}
function tickParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const m = parts[i], u = m.userData; u.life += dt;
    if(u.kind!=='dust') u.v.y -= 14*dt;
    m.position.addScaledVector(u.v, dt);
    if(u.kind==='dust'){ m.scale.multiplyScalar(1+dt*1.6); }
    else { m.rotation.x += dt*6; m.rotation.y += dt*5; }
    m.material.opacity = Math.max(0, 1 - u.life/u.max);
    if(u.life > u.max){ scene.remove(m); m.material.dispose(); parts.splice(i,1); }
  }
}

/* ---------- game state ---------- */
let state = 'aim';           // aim | pulling | flying | result
let shot = null, pull = {power:0, heading:0}, inp = {boost:false, steer:0}, runCoins = 0, endT = 0, crashed = false, shake = 0;
const dots = new THREE.InstancedMesh(new THREE.SphereGeometry(.14,10,8), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.9}), 36);
dots.count = 0; scene.add(dots);

function resetShot(){
  state = 'aim'; shot = null; pull.power = 0; pull.heading = 0; runCoins = 0; crashed = false;
  inp.boost = false; inp.steer = 0;
  car.position.set(0,0,0); car.rotation.set(0,0,0);
  obstacles.forEach(o=>{ if(o.broken){ o.broken=false; o.group.visible = true; } });
  coins.forEach(c=>{ c.taken=false; c.mesh.visible = true; });
  dots.count = 0;
  updateCatapult();
  $('result').hidden = true; $('flight').hidden = true; $('aimhint').hidden = false; $('dist').hidden = true; $('garageBtn').hidden = false;
  if(car.userData.boostFlames) car.userData.boostFlames.forEach(f=>f.visible=false);
  camSnap = true;
}
function updateCatapult(){
  const zBack = car.position.z + carRear + .25;
  const c = V3(car.position.x, .4, zBack);
  pouch.position.copy(c); pouch.rotation.y = car.rotation.y;
  const flying = state==='flying' || state==='result';
  const pc = flying ? V3(0,.4,carRear+.5) : c;
  if(flying) pouch.position.copy(pc);
  [-1,1].forEach((s,i)=>stretch(bands[i], V3(s*2.3,2.6,3.3), V3(pc.x + s*.58, pc.y, pc.z)));
}
function predict(){
  const s = makeShot(carIdx, save.lv[carIdx], pull.power, pull.heading);
  const m = new THREE.Matrix4(); let k = 0;
  for(let i=0;i<360 && k<36;i++){
    stepShot(s, 1/60, null);
    if(i%5===0){ m.makeTranslation(s.x, s.y+.6, s.z); dots.setMatrixAt(k++, m); }
    if(s.mode!=='air') break;
  }
  dots.count = k; dots.instanceMatrix.needsUpdate = true;
}

/* ---------- input: drag back to aim ---------- */
let drag = null;
canvas.addEventListener('pointerdown', e=>{
  if(state!=='aim' || !$('garage').hidden) return;
  drag = {x:e.clientX, y:e.clientY, id:e.pointerId}; canvas.setPointerCapture(e.pointerId);
  state = 'pulling'; $('aimhint').hidden = true;
});
canvas.addEventListener('pointermove', e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const H = stage.clientHeight, W = stage.clientWidth;
  const dy = e.clientY - drag.y, dx = e.clientX - drag.x;
  pull.power = Math.max(0, Math.min(1, dy/(H*.32)));
  pull.heading = Math.max(-.3, Math.min(.3, dx/(W*.45)*.3));
  car.position.set(Math.sin(pull.heading)*pull.power*1.6, 0, Math.cos(pull.heading)*pull.power*1.6);
  car.rotation.y = pull.heading;
  updateCatapult(); predict();
  $('power').style.setProperty('--p', pull.power);
});
function release(e){
  if(!drag) return; drag = null;
  if(pull.power < .12){ state = 'aim'; car.position.set(0,0,0); car.rotation.y = 0; pull.power=0; updateCatapult(); dots.count=0; $('aimhint').hidden=false; $('power').style.setProperty('--p',0); return; }
  launch();
}
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);

function launch(){
  shot = makeShot(carIdx, save.lv[carIdx], pull.power, pull.heading);
  shot.x = car.position.x; shot.z = car.position.z;
  state = 'flying'; dots.count = 0; updateCatapult();
  $('flight').hidden = false; $('dist').hidden = false; $('garageBtn').hidden = true; $('power').style.setProperty('--p',0);
  const sp = SPECIALS[carIdx];
  $('specialBtn').hidden = false; $('specialBtn').disabled = false; $('specialName').textContent = sp.name;
  $('boostBtn').hidden = save.lv[carIdx].boost === 0;
  spawn('dust', V3(car.position.x,.3,car.position.z+1.5), 8);
}

function hold(el, on, off){
  const start = e=>{ e.preventDefault(); el.setPointerCapture && el.setPointerCapture(e.pointerId); on(); el.classList.add('down'); };
  const end = ()=>{ off(); el.classList.remove('down'); };
  el.addEventListener('pointerdown', start); el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
}
hold($('boostBtn'), ()=>inp.boost=true, ()=>inp.boost=false);
$('specialBtn').addEventListener('click', ()=>{ if(shot && useSpecial(shot)) $('specialBtn').disabled = true; });
addEventListener('keydown', e=>{
  if(state!=='flying') return;
  if(e.code==='Space'){ inp.boost = true; e.preventDefault(); }
  if(e.code==='KeyS' && shot && useSpecial(shot)) $('specialBtn').disabled = true;
});
addEventListener('keyup', e=>{ if(e.code==='Space') inp.boost=false; });

/* ---------- collisions ---------- */
function hitTest(s){
  const d = -s.z, hw = car.userData.halfW + .35;
  // side buildings
  if(Math.abs(s.x) > SIDE_X - hw){
    const side = Math.sign(s.x);
    for(const b of sideBlocks) if(b.side===side && d+1.5 > b.z0 && d-1.5 < b.z1 && s.y < b.h) return {d:Math.max(0,d), what:'side'};
  }
  for(const o of obstacles){
    if(o.broken) continue;
    if(d+1.9 > o.z0 && d-1.9 < o.z1 && s.y < o.h && s.x+hw > o.x0 && s.x-hw < o.x1){
      if(s.smash){ s.smash = false; breakObstacle(o, 'chunk'); shake = .5; return null; }
      return {d:o.z0, what:o.o.kind};
    }
  }
  return null;
}

function breakObstacle(o, fx){
  obstacles.forEach(p=>{ if(p.group===o.group) p.broken = true; });
  o.group.visible = false;
  const c = V3((o.x0+o.x1)/2, Math.min(o.h, 8)*.5, -(o.z0+o.z1)/2);
  for(let i=0;i<3;i++) spawn(fx, V3(c.x + (i-1)*4, c.y + i, c.z), 12);
}
/* lightning: a jagged bolt from the sky onto the next building, which then breaks */
const boltMat = new THREE.MeshBasicMaterial({color:0xcfeaff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false});
let boltFx = null;
function zap(s){
  const d = -s.z, target = obstacles.filter(o=>!o.broken && o.z0 > d + 2).sort((a,b)=>a.z0-b.z0)[0];
  if(!target) return;
  const tx = target.o.kind==='bld' ? Math.max(target.x0+1, Math.min(target.x1-1, s.x)) : (target.x0+target.x1)/2;
  const top = V3(tx + 6, 70, -target.z0 - 8), end = V3(tx, target.h, -target.z0);
  const g = new THREE.Group();
  let prev = top.clone();
  for(let i=1;i<=9;i++){
    const t = i/9, p = top.clone().lerp(end, t); if(i<9){ p.x += (Math.random()-.5)*5; p.z += (Math.random()-.5)*3; }
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1,6), boltMat); stretch(seg, prev, p); g.add(seg); prev = p;
  }
  linearize(g); scene.add(g); boltFx = {g, t:0, target};
  spawn('spark', end, 30);
}
function tickBolt(dt){
  if(!boltFx) return;
  boltFx.t += dt; boltMat.opacity = Math.max(0, 1 - boltFx.t/.6) * (Math.random()<.5 ? 1 : .5);
  if(boltFx.t > .12 && !boltFx.target.broken){ breakObstacle(boltFx.target, 'chunk'); shake = .7; }
  if(boltFx.t > .6){ scene.remove(boltFx.g); boltFx = null; }
}

/* ---------- HUD ---------- */
const fmt = n=>Math.round(n).toLocaleString('en-GB');
function refreshHUD(){
  $('coins').textContent = fmt(save.coins);
  $('carName').textContent = CARS[carIdx].name;
  $('carTier').textContent = 'Car '+(carIdx+1)+' of 6';
  $('carImg').src = THUMBS[CARS[carIdx].key];
  $('best').textContent = save.best[carIdx] ? fmt(save.best[carIdx])+' m' : '—';
  const lv = save.lv[carIdx], ready = UPG.some(u=>lv[u.k]<MAX_LV && upgradeCost(carIdx, lv[u.k]) <= save.coins);
  $('garageBtn').classList.toggle('glow', ready || canUnlock());
}
function canUnlock(){ return UPG.every(u=>save.lv[carIdx][u.k]>=MAX_LV) && save.unlocked < 6 && carIdx === save.unlocked-1; }
function finishRun(){
  state = 'result';
  const dist = Math.max(0, Math.round(-shot.z));
  const distCoins = Math.round(dist*1), total = distCoins + runCoins*5;
  save.coins += total;
  const isBest = dist > save.best[carIdx]; if(isBest) save.best[carIdx] = dist;
  persist();
  $('resTitle').textContent = crashed ? 'CRASH!' : (dist > 60 ? 'WHOOSH!' : 'NICE ONE!');
  $('resDist').textContent = fmt(dist)+' m';
  $('resBest').hidden = !isBest;
  $('resCoins').textContent = '+'+fmt(total);
  $('resBreak').textContent = fmt(distCoins)+' for distance'+(runCoins? ' + '+fmt(runCoins*5)+' from '+runCoins+' coin'+(runCoins>1?'s':'') : '');
  $('result').hidden = false; $('flight').hidden = true;
  refreshHUD();
}
$('againBtn').addEventListener('click', resetShot);
$('resGarage').addEventListener('click', ()=>{ resetShot(); openGarage(); });

/* ---------- garage ---------- */
const ICONS = {
  engine:'<path d="M6 9h3l1-2h5l1 2h2v3h2v4h-2v2H9l-3-3H4v-5h2z"/>',
  wheels:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="var(--sun)"/>',
  wings:'<path d="M2 14l9-4h2l9 4-1 2-8-2h-2l-8 2z"/>',
  boost:'<path d="M12 2c3 4 5 7 5 11a5 5 0 0 1-10 0c0-2 1-4 2-5 0 2 1 3 2 3 0-3-1-6 1-9z"/>',
};
function openGarage(){ renderGarage(); $('garage').hidden = false; $('closeGarage').focus(); }
$('garageBtn').addEventListener('click', ()=>{ if(state==='aim') openGarage(); });
$('closeGarage').addEventListener('click', ()=>{ $('garage').hidden = true; });
function renderGarage(){
  const lv = save.lv[carIdx];
  $('gCoins').textContent = fmt(save.coins);
  $('gName').textContent = CARS[carIdx].name;
  $('gSpecial').textContent = SPECIALS[carIdx].name;
  $('gSpecialText').textContent = SPECIALS[carIdx].text;
  $('gImg').src = THUMBS[CARS[carIdx].key];
  const list = $('upgList'); list.innerHTML = '';
  UPG.forEach(u=>{
    const l = lv[u.k], max = l>=MAX_LV, cost = max ? 0 : upgradeCost(carIdx, l), afford = save.coins >= cost;
    const row = document.createElement('div'); row.className = 'upg';
    row.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[u.k]}</svg>
      <div class="upg-txt"><b>${u.name}</b><span>${u.text}</span>
      <div class="pips">${[0,1,2].map(i=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div>
      <button class="buy" id="buy-${u.k}" ${max||!afford?'disabled':''}>${max ? 'MAX' : '<span class="cn"></span>'+fmt(cost)}</button>`;
    list.appendChild(row);
    row.querySelector('button').addEventListener('click', ()=>{
      if(save.coins < cost || max) return;
      save.coins -= cost; lv[u.k]++; persist();
      fitUpgrades(car, lv, CARS[carIdx].accent); linearize(car); car.userData.flames.forEach(f=>f.visible = (carIdx===4));
      renderGarage(); refreshHUD();
    });
  });
  const un = $('unlockBtn');
  if(canUnlock()){ un.hidden = false; un.textContent = 'Unlock '+CARS[save.unlocked].name+'!'; }
  else un.hidden = true;
  const doneCount = UPG.reduce((a,u)=>a+lv[u.k],0);
  $('gProg').style.setProperty('--p', doneCount/12);
  $('gProgTxt').textContent = doneCount===12 ? 'All upgrades done!' : (12-doneCount)+' upgrades to go before the next car';
  const cl = $('carList'); cl.innerHTML = '';
  CARS.forEach((c,i)=>{
    const b = document.createElement('button'); b.className = 'mini'; b.id = 'mini-'+i;
    const locked = i >= save.unlocked;
    b.disabled = locked; b.setAttribute('aria-pressed', i===carIdx);
    b.innerHTML = `<img alt="" src="${THUMBS[c.key]}"><span>${locked ? 'Locked' : c.name}</span>${locked?'<em aria-hidden="true">?</em>':''}`;
    b.addEventListener('click', ()=>{ save.car = i; persist(); loadCar(i); renderGarage(); });
    cl.appendChild(b);
  });
}
$('unlockBtn').addEventListener('click', ()=>{
  if(!canUnlock()) return;
  save.unlocked++; save.car = save.unlocked-1; persist(); loadCar(save.car); renderGarage();
  spawn('star', V3(0,2,0), 30);
});
$('testCoins').addEventListener('click', ()=>{ save.coins += 1000; persist(); renderGarage(); refreshHUD(); });
$('testMax').addEventListener('click', ()=>{ UPG.forEach(u=>save.lv[carIdx][u.k]=MAX_LV); persist(); fitUpgrades(car, save.lv[carIdx], CARS[carIdx].accent); linearize(car); renderGarage(); refreshHUD(); });
$('testReset').addEventListener('click', ()=>{ save = freshSave(); persist(); loadCar(0); renderGarage(); });

/* ---------- camera ---------- */
let camSnap = true;
const camPos = V3(0,3.4,10), camLook = V3(0,1.4,-8);
function cameraGoal(){
  if(state==='aim' || state==='pulling') return {p:V3(0, 3.1, 9.0), l:V3(0, 1.2, -14)};
  const h = shot ? shot.heading : 0, x = car.position.x, y = car.position.y, z = car.position.z;
  const back = 8.8, up = 3.2;
  return {p:V3(x + Math.sin(h)*back, Math.max(1.6, y + up), z + Math.cos(h)*back), l:V3(x - Math.sin(h)*8, y + 1.2, z - Math.cos(h)*8)};
}

/* ---------- loop ---------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  camera.fov = w/h < .8 ? 68 : 55; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
const clock = new THREE.Clock(); let acc = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05), now = clock.elapsedTime;
  if(state==='flying' && shot){
    acc += dt;
    while(acc >= 1/120){
      acc -= 1/120;
      const wasAir = shot.mode;
      stepShot(shot, 1/120, inp);
      if(shot.mode!=='crash' && shot.mode!=='stop' && !crashed){
        const hit = hitTest(shot);
        if(hit){
          crashed = true; shot.mode = 'crash'; shot.burn = 0;
          shot.z = -hit.d + 1.9; shot.vx = 0; shot.vz = 0; shot.vy = Math.min(shot.vy, 0);
          spawn('star', V3(shot.x, shot.y+1, shot.z-1.5), 18); shake = .6;
        }
      }
    }
    shot.events.splice(0).forEach(ev=>{
      if(ev==='bounce' || ev==='land' || ev==='stomp') spawn('dust', V3(shot.x,.2,shot.z), ev==='stomp'?16:7);
      if(ev==='zap') zap(shot);
      if(ev==='armed') spawn('star', V3(shot.x, shot.y+1.2, shot.z), 10);
      if(ev==='swerve') spawn('star', V3(shot.x, shot.y+.8, shot.z+1.5), 8);
    });
    car.position.set(shot.x, shot.y, shot.z);
    car.rotation.y = shot.heading;
    car.rotation.x = shot.mode==='air' ? Math.max(-.35, Math.min(.3, shot.vy*.018)) : car.rotation.x*.8;
    if(crashed) car.rotation.z = Math.sin(now*30)*.05*Math.max(0, shake);
    const sp = Math.hypot(shot.vx, shot.vz);
    car.userData.wheels.forEach(w=>{ w.spin.rotation.x -= sp*dt/w.r; });
    (car.userData.boostFlames||[]).forEach(f=>{ f.visible = shot.boosting && !(carIdx===4 && shot.burn>0 && !inp.boost); f.scale.set(1,1,.8+Math.random()*.5); });
    (car.userData.burnFlames||[]).forEach(f=>{ f.visible = shot.burn>0; f.scale.set(1,1,.8+Math.random()*.6); });
    if(car.userData.mainFlame){ const f = car.userData.mainFlame, big = shot.burn>0 ? 2.2 : (shot.mode==='air' ? 1.2 : .7); f.scale.set(1+(big-1)*.3, 1+(big-1)*.3, big*(.85+Math.random()*.3)); }
    // coins
    coins.forEach(c=>{ if(!c.taken && c.mesh.position.distanceToSquared(car.position.clone().add(V3(0,.8,0))) < 3.2){ c.taken = true; c.mesh.visible = false; runCoins++; spawn('star', c.mesh.position.clone(), 5); } });
    $('distNum').textContent = fmt(Math.max(0,-shot.z));
    $('runCoins').textContent = runCoins ? '+'+runCoins*5 : '';
    $('boostBtn').style.setProperty('--f', save.lv[carIdx].boost ? Math.max(0, shot.fuel/(.32*save.lv[carIdx].boost)) : 0);
    if(shot.mode==='stop'){ if(!endT) endT = now; if(now - endT > (crashed? .9 : .6)){ endT = 0; finishRun(); } }
    updateCatapult();
  } else if(car && car.userData.mainFlame){
    const f = car.userData.mainFlame; f.scale.set(.75,.75,.6+Math.random()*.15);
  }
  coins.forEach((c,i)=>{ if(!c.taken) c.mesh.rotation.y = now*2.4 + i*.3; });
  tickParts(dt); tickBolt(dt);
  shake = Math.max(0, shake - dt);
  // camera: stays the same distance behind the car
  const g = cameraGoal();
  if(camSnap){ camPos.copy(g.p); camLook.copy(g.l); camSnap = false; }
  const k = state==='flying' ? 1 - Math.pow(.00002, dt) : 1 - Math.pow(.01, dt);
  camPos.lerp(g.p, k); camLook.lerp(g.l, k);
  camera.position.copy(camPos);
  if(shake>0){ camera.position.x += (Math.random()-.5)*shake*.6; camera.position.y += (Math.random()-.5)*shake*.6; }
  camera.lookAt(camLook);
  if(state==='flying' && shot){ const target = 55 + Math.min(14, Math.hypot(shot.vx,shot.vz)*.15) + (camera.aspect<.8?13:0); camera.fov += (target - camera.fov)*.08; camera.updateProjectionMatrix(); }
  scene.userData.sky.position.copy(camera.position);
  const cp = car ? car.position : V3();
  sun.position.set(cp.x - 6, cp.y + 24, cp.z + 13); sun.target.position.set(cp.x, cp.y, cp.z - 2);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* hex colours are written in sRGB; convert once so they render true (not washed out) */
function linearize(root){
  root.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m=>{
      if(m.userData.lin) return; m.userData.lin = true;
      if(m.color && !m.vertexColors) m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
    });
  });
}
scene.fog.color.convertSRGBToLinear();
linearize(scene);
loadCar(Math.min(save.car, save.unlocked-1));
frame();

document.getElementById('loading').hidden = true;
</script>
